name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v (z. B. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build web & Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare optional signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        shell: bash
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -PversionCode=${{ steps.version.outputs.code }} \
              -PversionName=${{ steps.version.outputs.version }}
            APK="app/build/outputs/apk/release/app-release.apk"
            SUFFIX="release"
          else
            ./gradlew assembleDebug --no-daemon \
              -PversionCode=${{ steps.version.outputs.code }} \
              -PversionName=${{ steps.version.outputs.version }}
            APK="app/build/outputs/apk/debug/app-debug.apk"
            SUFFIX="debug"
          fi
          cp "$APK" "../kartenweis-${{ steps.version.outputs.version }}-${SUFFIX}.apk"

      - name: Package web build
        run: |
          cd dist
          zip -r "../kartenweis-${{ steps.version.outputs.version }}-web.zip" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Kartenweis ${{ steps.version.outputs.version }}"
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            kartenweis-${{ steps.version.outputs.version }}-*.apk
            kartenweis-${{ steps.version.outputs.version }}-web.zip

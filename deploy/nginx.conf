server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/geo+json image/svg+xml;
  gzip_min_length 1024;

  # Immutable hashed assets from Vite.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Geo/JSON data can change between releases, but should be cached briefly.
  location ~* \.(geojson|json|webmanifest)$ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # Never cache the app shell or service worker.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback for client-side routes (currently none, but future-proof).
  location / {
    try_files $uri $uri/ /index.html;
  }
}

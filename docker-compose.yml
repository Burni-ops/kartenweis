services:
  kartenweis:
    image: ghcr.io/burni-ops/kartenweis:latest
    build:
      context: .
      args:
        VITE_BASE: /
        VITE_GITHUB_REPO: Burni-ops/kartenweis
    container_name: kartenweis
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
